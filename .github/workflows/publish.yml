# npm 发布工作流(Trusted Publisher / OIDC,零 token,直接流)
# 直接流:push v* tag 即经 OIDC 直接 npm publish,全自动,无人工 2FA 闸门。
# 前置:npmjs.com 已为包配置 Trusted Publisher,绑定本仓库 + 本 workflow 文件名,
# 且其 Allowed actions 允许直接发布(npm publish)。
name: publish

on:
  push:
    tags:
      - "v*" # 仓库 tag 约定: vX.Y.Z,与 package.json version 一一对应

permissions:
  contents: read
  id-token: write # Trusted Publishing(OIDC)必需;同时自动生成 provenance

jobs:
  publish:
    runs-on: ubuntu-latest # 测试为纯 bun 单测(mock 注入),无 Windows 平台依赖
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # 定制点:Node 24 LTS(npm publish 无 npm 11 门槛)
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile # 项目用 bun 管理依赖(有 bun.lock,无 package-lock.json)

      - name: Run tests
        run: bun run test

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      # 直接流:OIDC 自动认证并生成 provenance(trusted publishing 下无需
      # --provenance 旗标,显式传入亦无冲突,官方示例即带该旗标)
      - name: Publish to npm registry
        run: npm publish --provenance
